[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspark-na-pratica"
version = "0.1.0"
description = "Projeto didático de apoio ao livro PySpark na Prática"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark==4.0.1",
    "delta-spark==4.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
