name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Audit book paths
        run: python scripts/audit_paths.py

      - name: Test
        run: pytest -q

      - name: Spark smoke
        run: python scripts/smoke_spark.py

      - name: Bronze pipeline
        run: python -m pyspark_na_pratica.pipelines.bronze_pedidos

      - name: Silver pipeline
        run: python -m pyspark_na_pratica.pipelines.silver_pedidos

      - name: Gold pipeline
        run: python -m pyspark_na_pratica.pipelines.gold_vendas

      - name: Delta smoke
        run: python scripts/smoke_delta.py
